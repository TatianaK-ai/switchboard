name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The guardrail suite asserts on code paths, not on model behaviour, so it needs
      # no API key and spends nothing. `python -m evals.run` is the end-to-end gate and
      # is run locally, because it does make real model calls.
      - name: Run guardrail tests
        run: python -m pytest -q -rs
